name: Keep Supabase active

on:
  schedule:
    - cron: '17 1,9,17 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database-read:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read public site content
        run: node keep-supabase-active.mjs
